services:
  - type: web
    name: exceed-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@exceed.local
      - key: ADMIN_PASSWORD
        value: admin123
      - key: GEMINI_API_KEY
        sync: false
